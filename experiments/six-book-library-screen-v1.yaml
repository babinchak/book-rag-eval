schemaVersion: 1
name: six-book-library-screen-v1
corpusPath: ../benchmarks/corpora/six-book-smoke.json
evalDir: ../.rag-eval/provisional-evals/six-book-library-v1
outputDir: ../.rag-eval/runs

chunker:
  kind: fixed-token
  size: 256
  overlap: 32
  encoding: cl100k_base

pipelines:
  - id: flat-random
    routing: { kind: flat }
    retriever: { kind: random, seed: 42 }
  - id: flat-bm25
    routing: { kind: flat }
    retriever: { kind: bm25 }
  - id: flat-openai-vector
    routing: { kind: flat }
    retriever: { kind: vector, embeddingModel: text-embedding-3-large }
  - id: flat-openai-hybrid
    routing: { kind: flat }
    retriever: { kind: hybrid-rrf, embeddingModel: text-embedding-3-large }
  - id: flat-voyage-vector
    routing: { kind: flat }
    retriever: { kind: vector, embeddingModel: voyage-4-large }
  - id: flat-voyage-hybrid
    routing: { kind: flat }
    retriever: { kind: hybrid-rrf, embeddingModel: voyage-4-large }
  - id: flat-colbertv2
    routing: { kind: flat }
    retriever: { kind: colbertv2 }
  - id: flat-bge-dense
    routing: { kind: flat }
    retriever: { kind: bge-m3, mode: dense }
  - id: flat-bge-sparse
    routing: { kind: flat }
    retriever: { kind: bge-m3, mode: sparse }
  - id: flat-bge-multivector
    routing: { kind: flat }
    retriever: { kind: bge-m3, mode: colbert-dense-shortlist, shortlist: 200 }
  - id: flat-bge-hybrid-dense-sparse
    routing: { kind: flat }
    retriever: { kind: bge-m3, mode: hybrid-dense-sparse-rrf }
  - id: flat-bge-hybrid-all
    routing: { kind: flat }
    retriever: { kind: bge-m3, mode: hybrid-all-rrf, shortlist: 200 }
  - id: hierarchical-bge-top1
    routing: { kind: bge-profile, topK: 1 }
    retriever: { kind: bge-m3, mode: hybrid-all-rrf, shortlist: 200 }
  - id: hierarchical-bge-top3
    routing: { kind: bge-profile, topK: 3 }
    retriever: { kind: bge-m3, mode: hybrid-all-rrf, shortlist: 200 }
  - id: hierarchical-bge-top5
    routing: { kind: bge-profile, topK: 5 }
    retriever: { kind: bge-m3, mode: hybrid-all-rrf, shortlist: 200 }
  - id: oracle-bge
    routing: { kind: oracle }
    retriever: { kind: bge-m3, mode: hybrid-all-rrf, shortlist: 200 }

contextBudgets: [512, 1024, 2048, 4096, 8192, 16384]
candidatePoolSize: 50

pricing:
  embeddingUsdPerMillion:
    text-embedding-3-large: 0.13
    voyage-4-large: 0.12
  rerankingUsdPerMillion:
    rerank-2.5-lite: 0.02
