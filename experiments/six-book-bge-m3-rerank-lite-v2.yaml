chunkers:
  - kind: fixed-token
    size: 256
    overlap: 32
    encoding: cl100k_base

retrievers:
  - kind: bge-m3
    model: BAAI/bge-m3
    mode: hybrid-all-rrf
    shortlist: 200
    reranker:
      kind: voyage
      model: rerank-2.5-lite

queryModes: [question]
contextBudgets: [512, 1024, 2048, 4096, 8192, 16384]
candidatePoolSize: 50
splits: [dev]
excludeEvidenceKinds: [table, image]

pricing:
  rerankingUsdPerMillion:
    rerank-2.5-lite: 0.02
